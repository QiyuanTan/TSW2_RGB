name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore dependencies
        run: dotnet restore TSW2Rgb.sln --configfile NuGet.Config --locked-mode
      - name: Verify formatting and analyzers
        run: dotnet format TSW2Rgb.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build TSW2Rgb.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test TSW2Rgb.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 7
